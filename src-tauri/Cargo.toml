[package]
name = "wordscript"
version = "0.2.2-alpha"
description = "WordScript — lightweight speech-to-text desktop utility"
authors = []
license = "AGPL-3.0-only"
repository = "https://github.com/sw-forge-org/WordScript"
edition = "2021"
# Required since the repo grew a second binary: `tauri dev` shells out to a bare
# `cargo run`, which refuses to guess between targets. Without this the dev host
# stops before it starts, and no test or `cargo check` catches it.
default-run = "wordscript"

[lib]
name = "wordscript_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "wordscript"
path = "src/main.rs"

# Route A of docs/known-issues/capture-loses-half-the-recording.md: an
# unattended soak of the input stream, with no app and no words. Not shipped —
# it is a diagnostic run by hand against the same device the app opens.
[[bin]]
name = "capture-soak"
path = "src/bin/capture_soak.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
keyring     = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# `stream` is B5's (ADR 0122): a 1.6 GB model file is read chunk by chunk so the
# drawn percentage is a measurement rather than a spinner, and so a cancel is
# noticed inside the transfer rather than after it.
reqwest     = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
# The integrity half of the same step. A downloaded model is verified against
# the catalogue row's checksum before it is renamed into place, so there is no
# window in which half a model is spelled like a whole one.
sha2        = "0.10"
arboard     = { version = "3.6", features = ["wayland-data-control"] }
enigo       = "0.6"
cpal        = "0.17"
hound       = "3.5"
rodio       = "0.22.2"
regex       = "1"
semver      = "1"
# Local civil dates for the transcript store (ADR 0074): the directory a person
# browses has to be filed under the day they experienced, and a transcript
# written at 00:30 belongs to that night rather than to the previous UTC day.
# `clock` is what carries `Local`; nothing else in the crate is used.
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Direct access to the GtkWindow behind the overlay, for the one thing tao does
# not expose: window opacity. It carries the fade-in that hides the black X11
# map frame (see the overlay opacity gate in `lib.rs`). The crate is already in
# the tree transitively via tauri/wry; this only makes it nameable.
#
# The version MUST track whatever tauri's gtk is. Two gtk versions in one tree
# means `WebviewWindow::gtk_window()` returns an `ApplicationWindow` from the
# other one, and the call stops compiling. On a tauri upgrade, check
# `cargo tree -p gtk` before changing this line.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# `statvfs`, for the one thing ADR 0122 asks up front: whether the model fits
# before the first byte is requested. Unix only, and the Windows equivalent is
# deliberately absent rather than written blind — `available_bytes` answers
# `None` where it cannot compute, which the caller reads as unanswered rather
# than as either "plenty" or "nothing".
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# This feature is used for production builds or when a dev server is not specified.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Dev builds: smaller target/ with debug=1 instead of debug=2.
# Incremental remains on so re-compiles after `cargo clean` stay fast.
debug         = 1
incremental   = true
codegen-units = 256

[profile.release]
# Smaller binary; LTO also helps
opt-level   = "s"
lto         = true
strip       = true
codegen-units = 1
panic       = "abort"

[patch.crates-io]
global-hotkey = { path = "../vendor/global-hotkey" }
